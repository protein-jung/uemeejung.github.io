<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna House — Coming Soon</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #0b0c10;
    color: #f2f0e8;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 520px;
  }
  .moon {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f2f0e8, #b7b2a0 70%);
    box-shadow: 0 0 40px rgba(242, 240, 232, 0.25);
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    margin: 0 0 12px;
    text-transform: uppercase;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #9a978c;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="moon"></div>
    <h1>Luna House</h1>
    <p>This page is being prepared.<br>Please check back soon.</p>
  </div>
</body>
</html>

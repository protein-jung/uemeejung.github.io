var CONFIG = (typeof document !== "undefined")

function r2(x){ return Math.round(x * 100) / 100; }

/* 채점 순수 함수 — 입력: 응답 객체 {B1:6,...}, 출력: 성향/유형/공간/불일치/일치도/만족도
   규칙: 역문항 8−x · 성향 P = 축별 5문항 평균 − 4 (둘째 자리) · P=0이면 이미지 문항 판정
         공간 S = 축별 지각 2문항 평균 − 4 · 불일치 |P−S| · 일치도 (1−평균불일치/6)×100
         만족도 = D1,D2,D7,(8−D8) 평균 */
function lfScore(a){
  var res = { axes: [], P: [], S: [], letters: [], mismatch: [] };
  CONFIG.axes.forEach(function(ax){
    var vals = ax.items.map(function(id){
      var v = a[id];
      if (v === undefined || v === null || v === "") return null;
      return ax.rev.indexOf(id) >= 0 ? 8 - v : v;
    });
    var P = (vals.indexOf(null) >= 0) ? null : r2(vals.reduce(function(s,v){ return s + v; }, 0) / vals.length - 4);
    var letter = null;
    if (P !== null) {
      if (P > 0) letter = ax.frontCode;
      else if (P < 0) letter = ax.backCode;
      else letter = (a[ax.img] === "A") ? ax.frontCode : ax.backCode; /* 이미지 A = 앞 글자 */
    }
    var pvals = ax.perc.map(function(id){ return a[id]; });
    var S = (pvals.some(function(v){ return v === undefined || v === null || v === ""; })) ? null
          : r2(pvals.reduce(function(s,v){ return s + Number(v); }, 0) / pvals.length - 4);
    var m = (P === null || S === null) ? null : r2(Math.abs(P - S));
    res.axes.push(ax); res.P.push(P); res.S.push(S); res.letters.push(letter); res.mismatch.push(m);
  });
  res.type = (res.letters.indexOf(null) >= 0) ? null : res.letters.join("");
  var t = res.type && CONFIG.types[res.type];
  res.nickname = t ? t.name : ""; res.typedesc = t ? t.desc : "";
  res.fit = (res.mismatch.indexOf(null) >= 0) ? null
          : r2((1 - res.mismatch.reduce(function(s,m){ return s + m; }, 0) / 4 / 6) * 100);
  var d1 = a.D1, d2 = a.D2, d7 = a.D7, d8 = a.D8;
  res.satisfaction = (d1 && d2 && d7 && d8) ? r2((d1 + d2 + d7 + (8 - d8)) / 4) : null;
  res.worstAxis = (function(){
    var best = -1, bi = -1;
    res.mismatch.forEach(function(m, i){ if (m !== null && m > best) { best = m; bi = i; } }); /* 동점 → 앞 축 */
    return bi;
  })();
  return res;
}

      ctx.font = "700 28px " + FH; ctx.globalAlpha = .85; ctx.fillText(wu, ix, my + mh - 10); ctx.globalAlpha = 1;
    } else {
      ctx.font = "700 26px " + FH;
      ctx.fillText("지금 내 방,", ix, my + mh - 88);
      ctx.fillText(CONFIG.axes[r.worstAxis].mismatch + josa(CONFIG.axes[r.worstAxis].mismatch) + " 제일 안 맞아 ㅠ", ix, my + mh - 54);
      ctx.font = "700 20px " + FH; ctx.globalAlpha = .85; ctx.fillText(wu, ix, my + mh - 18); ctx.globalAlpha = 1;
    }
    ctx.restore();
    /* 푸터 */
    ctx.fillStyle = "#fff"; ctx.font = "700 24px " + FS; ctx.textAlign = "left"; ctx.fillText("LIVFIT · 내 방 vs 나", 64, H - (story ? 90 : 46));
    var linkTxt = (location.origin === "null" || location.protocol === "file:") ? "" : (location.host + location.pathname).replace(/\/$/, "");
    if (linkTxt.length > 38) linkTxt = linkTxt.slice(0, 36) + "…";
    ctx.textAlign = "right"; ctx.font = "500 21px " + FM; ctx.globalAlpha = .9;
    ctx.fillText("너도 해봐 → " + (linkTxt || "LIVFIT"), W - 64, H - (story ? 90 : 46)); ctx.globalAlpha = 1;
    return cv;
  }
  function dataUrlToFile(url, name){
    var p = url.split(","), m2 = p[0].match(/:(.*?);/), b = atob(p[1]), n2 = b.length, u = new Uint8Array(n2);
    while (n2--) u[n2] = b.charCodeAt(n2);
    return new File([u], name, { type: m2 ? m2[1] : "image/png" });
  }
  function downloadCard(mode){
    var r = st.result || lfScore(st.answers); st.result = r;
    var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
      document.fonts.load('900 40px "Pretendard Variable"'), document.fonts.load('700 30px "Gaegu"'), document.fonts.load('800 30px "JetBrains Mono"')
    ]).catch(function(){}) : Promise.resolve();
    fontsReady.then(function(){ return loadImg(room(r.type)).catch(function(){ return null; }); }).then(function(im){
      try {
        var url = drawCard(mode, im).toDataURL("image/png");
        var fname = "LIVFIT_" + r.type + "_" + mode + ".png", shared = false;
        try {
          if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
            var shFile = dataUrlToFile(url, fname);
            if (navigator.canShare({ files: [shFile] })) {
              shared = true;
              navigator.share({ files: [shFile], title: "LIVFIT 내 방 유형 카드" }).catch(function(er){
                if (!er || er.name !== "AbortError") showCardOverlay(url);
              });
            }
          }
        } catch (e2) { shared = false; }
        if (!shared) {
          if (/iPhone|iPad|Android/i.test(navigator.userAgent)) showCardOverlay(url);
          else { var aEl = document.createElement("a"); aEl.href = url; aEl.download = fname; document.body.appendChild(aEl); aEl.click(); aEl.remove(); showCardOverlay(url); }
        }
      } catch (e) { showCardOverlay(null, String(e && e.message || e)); }
    });
  }
  function showCardOverlay(url, errMsg){
    var old = document.getElementById("cardoverlay"); if (old) old.remove();
    var ov = document.createElement("div");
    ov.id = "cardoverlay";
    var inner = '<div class="ov-box"><div style="font-weight:900;font-size:19px;margin-bottom:10px">카드 이미지 완성 ✦</div>';
    inner += url ? '<img src="' + url + '" alt="결과 카드">' : "<p>이미지 생성에 실패했어요: " + esc(errMsg || "") + "</p>";
    inner += '<p class="ov-help">· 휴대폰: 이미지를 <b>길게 눌러</b> "사진에 저장"<br>· PC: 자동으로 내려받아져요 (안 되면 우클릭 → 이미지 저장)<br>· 카톡·인스타 인앱 브라우저에선 저장이 막힐 수 있어요 — ⋯ 메뉴에서 "기본 브라우저로 열기"</p>'
      + '<button class="bpill" id="ovclose" style="background:' + BR.ink + ';color:#fff">닫기</button></div>';
    ov.innerHTML = inner;
    ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    document.getElementById("ovclose").onclick = function(){ ov.remove(); };
  }

  /* ---------- 부팅 ---------- */
  var self = lfSelftest();
  if (!self.ok) { console.error("자가검산 FAIL", self.fails); var bn = document.createElement("div"); bn.className = "banner"; bn.style.margin = "12px 18px 0"; bn.textContent = "⚠ 자가검산 실패 — 개발팀에 즉시 보고하세요: " + self.fails.join(", "); document.body.insertBefore(bn, document.getElementById("app")); }
  else console.info("자가검산 PASS (예시-001 = 지시서 4장 기대값 일치)");
  if (serverMode) setTimeout(flushLocal, 400);
  renderIntroDirect();
})();
</script>
